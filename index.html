<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F8">
<title>EuroTrip 2027 · Paris · Munique · Berlim</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EuroTrip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#EEF2F8; --ink2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F5FA; --line:#E1E8F1; --line2:#CBD6E6;
 --text:#152238; --muted:#5D6E88; --dim:#93A1B7;
 --navy:#1B3A6B; --navy2:#12294F; --stripbg:#1B3A6B; --striptext:#FFFFFF;
 --par:#E8722E; --mun:#1B3A6B; --ber:#3E82C4;
 --ok:#1E9E74; --danger:#DC5A46; --warn:#D98A2B; --orange:#E8722E;
 --shadow:0 3px 12px rgba(21,34,56,.05); --shadowlg:0 8px 24px rgba(18,41,79,.14);
 --r:16px;
}
[data-theme="dark"]{
 --bg:#0D1526; --ink2:#141F35; --panel:#16233C; --panel2:#1D2C48; --line:#28374F; --line2:#3A4C68;
 --text:#E7EDF6; --muted:#94A6C0; --dim:#657899;
 --navy:#5B9BD8; --navy2:#3E82C4; --stripbg:#111B2E; --striptext:#F1F5FB;
 --par:#F0894A; --mun:#5B9BD8; --ber:#5B9BD8;
 --ok:#33B98A; --danger:#E56B57; --warn:#E0A03F; --orange:#F0894A;
 --shadow:0 3px 12px rgba(0,0,0,.28); --shadowlg:0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);
 font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
 max-width:520px;margin:0 auto;min-height:100vh;
 padding-bottom:calc(78px + env(safe-area-inset-bottom));
 font-feature-settings:"tnum" 1,"cv05" 1}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:calc(200px + env(safe-area-inset-top));pointer-events:none;z-index:0;background:var(--bg)}
.wrap{position:relative;z-index:1;padding:calc(14px + env(safe-area-inset-top)) 14px 0;
 padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right))}
.hidden{display:none!important}
b{font-weight:700}
a{color:var(--mun)}

/* ---------- tipografia ---------- */
.disp{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.03}
.kicker{font-size:10.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;color:var(--dim)}
.sect{font-size:11px;letter-spacing:.15em;font-weight:800;text-transform:uppercase;color:var(--muted);
 display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 2px 8px}
.sect:first-child{margin-top:6px}
.sect .r{letter-spacing:.02em;font-size:12px;font-weight:600;color:var(--dim);text-transform:none}
.money{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- cabeçalho / boarding strip ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .kicker{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:11px;
 width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:0 0 auto}
.iconbtn:active{background:var(--panel2)}
.iconbtn.on{border-color:var(--orange);color:var(--orange)}
.me-chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);
 border-radius:99px;padding:4px 5px 4px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.me-chip button{background:var(--panel2);border:1px solid var(--line2);color:var(--muted);border-radius:99px;
 padding:3px 9px;font-size:10.5px;font-weight:700;cursor:pointer}

.strip{position:relative;background:var(--stripbg);color:var(--striptext);
 border:1px solid var(--stripbg);border-radius:var(--r);padding:13px 15px 12px;overflow:hidden;margin-bottom:8px;box-shadow:var(--shadowlg)}
.strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.strip .route{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:rgba(255,255,255,.82);flex-wrap:wrap}
.strip .route .ar{color:rgba(255,255,255,.4);font-weight:600}
.strip h1{font-size:27px;margin:5px 0 3px}
.strip .when{color:rgba(255,255,255,.72);font-size:12.5px;font-weight:600}
.strip .cd{position:absolute;right:14px;top:12px;text-align:right}
.wkchip{display:none}
.wkchip.on{display:inline-block;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
 background:var(--orange);color:#fff;border-radius:99px;padding:3px 8px}
.strip .cd .n{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:26px;line-height:1;color:var(--par)}
.strip .cd .u{font-size:9.5px;letter-spacing:.16em;font-weight:800;color:rgba(255,255,255,.55);text-transform:uppercase}
.perf{height:1px;margin:11px -15px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}

/* ---------- painéis genéricos ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--shadow)}
.card.okline{border-color:rgba(30,158,116,.4)}
.card.tight{padding:11px 13px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.empty{color:var(--dim);text-align:center;padding:22px 14px;border:1px dashed var(--line);border-radius:14px;font-size:13.5px;line-height:1.6}
.note{color:var(--dim);font-size:11.5px;line-height:1.6;margin-top:8px}
.foot{color:var(--dim);text-align:center;font-size:11.5px;margin:22px 8px 4px;line-height:1.7}
.warnbox{background:#FDF3E4;border:1px solid #F0D5A8;color:#9A6512;border-radius:12px;padding:10px 12px;font-size:12px;margin:0 0 12px;line-height:1.5}
.okbox{background:#E4F5EE;border:1px solid #A9DCC9;color:#137A57;border-radius:12px;padding:10px 12px;font-size:12px;margin:0 0 12px;line-height:1.5}

/* ---------- formulários ---------- */
input,select,textarea{background:var(--panel);border:1px solid var(--line2);color:var(--text);
 border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;width:100%;outline:none;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{border-color:var(--mun)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
 background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--dim);margin:0 0 5px 2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.fld{margin-bottom:9px}
.btn{background:var(--orange);border:none;color:#fff;border-radius:12px;padding:13px 16px;font-size:15px;
 font-weight:800;width:100%;cursor:pointer;font-family:inherit}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--panel2);color:var(--navy);border:1px solid var(--line2)}
.btn.gh{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:10px}
.btn.dgr{background:transparent;border:1px solid #6B2A22;color:var(--danger)}
.err{color:var(--danger);font-size:12.5px;text-align:center;margin-top:9px;min-height:16px;font-weight:600}
.x{background:transparent;border:none;color:var(--dim);font-size:17px;cursor:pointer;padding:4px 6px;line-height:1;flex:0 0 auto}
.x:active{color:var(--danger)}

/* chips de pessoa */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:99px;
 padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.solo.on{border-color:var(--par)}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;
 overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg div{flex:1 0 auto;white-space:nowrap;text-align:center;padding:9px 14px;font-size:13.5px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer}
.seg div.on{background:var(--panel);color:var(--navy);box-shadow:var(--shadow)}

/* ---------- barra inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
 padding:7px 4px calc(6px + env(safe-area-inset-bottom));display:flex;max-width:520px;margin:0 auto}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;
 color:var(--dim);font-size:8.8px;font-weight:700;letter-spacing:0;cursor:pointer;border-radius:10px;white-space:nowrap}
.nav div .ic{width:23px;height:23px;display:flex;align-items:center;justify-content:center}
.nav div .ic svg{width:23px;height:23px;color:var(--dim)}
.nav div.on .ic svg{color:var(--orange)}
.nav div.on{color:var(--navy)}
.nav div.on .ic{filter:none}
.navdot{width:16px;height:2px;border-radius:2px;background:transparent;margin-top:1px}
.nav div.on .navdot{background:var(--orange);width:20px}

.panel-v{display:none}
.panel-v.on{display:block}

/* ---------- trilho de progresso ---------- */
.rail{position:relative;height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
 background:var(--orange);transition:width .5s cubic-bezier(.3,1,.4,1)}
.rail.ok i{background:var(--ok)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:.08em;margin-bottom:2px}

/* hero do cofre */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .lab{font-size:10.5px;letter-spacing:.18em;font-weight:800;text-transform:uppercase;color:var(--dim)}
.hero .big{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:36px;line-height:1.05;margin:3px 0 2px;letter-spacing:-.02em}
.hero .of{color:var(--muted);font-size:13px;font-weight:600}
.hero .pct{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:26px;font-weight:800;color:var(--par);align-self:flex-start;line-height:1.2}
.hero.done .pct{color:var(--ok)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.kpi .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* lista de depósitos com scroll */
.deplist{max-height:236px;overflow-y:auto;-webkit-overflow-scrolling:touch;
 border:1px solid var(--line);border-radius:14px;padding:8px 8px 1px;margin-bottom:2px;
 -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
 mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.deplist .li{margin-bottom:7px}
.deplist::-webkit-scrollbar{width:5px}
.deplist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}

/* meses do cofre */
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.ml{font-size:12px;font-weight:700;color:var(--muted);flex:0 0 50px}
.mb{flex:1;height:6px;border-radius:3px;background:var(--ink2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:3px;background:var(--orange)}
.mv{font-size:13.5px;font-weight:700;flex:0 0 auto}

/* rótulos, links e selos */
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--dim)}
.lnk{color:var(--mun);font-weight:700;cursor:pointer;border-bottom:1px dashed rgba(90,169,230,.45)}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);
 color:var(--muted);border-radius:99px;padding:5px 11px;white-space:nowrap;flex:0 0 auto}
.badge.on{border-color:var(--ok);color:var(--ok);background:rgba(30,158,116,.1)}

/* listas */
.li{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
 border-radius:13px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.li .t{flex:1;min-width:0}
.li .t .n{font-size:14.5px;font-weight:600;word-break:break-word}
.li .t .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.li .v{font-size:15px;font-weight:800;white-space:nowrap}
.li.done{opacity:.5}
.li.done .t .n{text-decoration:line-through}
.tick{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:1.5px solid var(--line2);background:var(--panel);
 display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;cursor:pointer}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pill{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:7px;padding:3px 7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.par{border-color:rgba(228,87,126,.5);color:var(--par)}
.pill.mun{border-color:rgba(90,169,230,.5);color:var(--mun)}
.pill.ber{border-color:rgba(240,169,59,.5);color:var(--ber)}
.pill.ok{border-color:rgba(60,201,160,.5);color:var(--ok)}
.pill.dgr{border-color:rgba(232,101,79,.5);color:var(--danger)}

/* tabela compacta */
.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:800;text-align:right;padding:0 0 7px}
.tb th:first-child{text-align:left}
.tb td{padding:9px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tb td:first-child{text-align:left;font-weight:600}
.tb tr.me td{color:var(--text)}
.tb tr.me td:first-child{color:var(--par)}
.tb tfoot td{border-top:1px solid var(--line2);font-weight:800}

/* roteiro */
.day{position:relative;padding-left:26px;margin-bottom:14px}
.day::before{content:"";position:absolute;left:7px;top:20px;bottom:-14px;width:2px;background:var(--line)}
.day:last-child::before{display:none}
.day .dot{position:absolute;left:0;top:5px;width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--muted)}
.day.par .dot{background:var(--par)} .day.mun .dot{background:var(--mun)} .day.ber .dot{background:var(--ber)}
.day .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.day .dh .d{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:16px;font-weight:800}
.day .dh .c{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.day.par .dh .c{color:var(--par)} .day.mun .dh .c{color:var(--mun)} .day.ber .dh .c{color:var(--ber)}
.act{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.act .h{font-size:12px;font-weight:800;color:var(--muted);flex:0 0 42px;padding-top:1px}
.act .b{flex:1;min-width:0}
.act .b .n{font-size:14.5px;font-weight:600}
.act .b .s{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.act .b .s a{word-break:break-all}

/* acerto */
.tr{display:flex;align-items:center;gap:10px;background:var(--panel);
 border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.tr .who{flex:1;font-size:14px;font-weight:700}
.tr .who .ar{color:var(--dim);margin:0 6px;font-weight:600}
.tr .v{font-size:16px;font-weight:800;color:var(--orange)}
.bal{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.bal .n{flex:1;font-weight:600;font-size:14px}
.bal .v{font-weight:800;font-size:14.5px}
.bal .v.pos{color:var(--ok)} .bal .v.neg{color:var(--danger)}
.barmini{height:5px;border-radius:3px;background:var(--line);flex:0 0 70px;position:relative;overflow:hidden}
.barmini i{position:absolute;top:0;bottom:0;background:var(--ok)}
.barmini i.neg{background:var(--danger)}

/* gráfico */
.chart{width:100%;height:104px;display:block;margin-top:4px}
.lg{display:flex;gap:14px;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:6px;flex-wrap:wrap}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* login */
.login{padding:calc(34px + env(safe-area-inset-top)) 20px 34px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto}
.login .disp{font-size:40px;text-align:center;margin:8px 0 4px}
.login .ll{color:var(--muted);text-align:center;font-size:13.5px;margin:14px 0 16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.pbtn{background:var(--panel);border:1px solid var(--line2);color:var(--navy);border-radius:13px;
 padding:15px 10px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit}
.pbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pininp{display:flex;justify-content:center;margin:0 0 14px}
.pininp input{max-width:250px;height:54px;text-align:center;font-size:19px;letter-spacing:.14em;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
 background:var(--navy);color:#fff;font-weight:800;padding:11px 18px;border-radius:12px;font-size:13.5px;
 box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:99;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-5px)}

.modal{position:fixed;inset:0;z-index:80;background:rgba(18,29,50,.5);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);border:1px solid var(--line2);border-top-left-radius:20px;border-top-right-radius:20px;
 width:100%;max-width:520px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal .box h3{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:19px;margin-bottom:12px}
.adm-scroll{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.btn,.chip,.seg div,.pbtn,.iconbtn,.nav div,.tick,.x{transition:transform .08s ease, background .15s ease, border-color .15s ease, color .15s ease}
.btn:active,.pbtn:active{transform:scale(.975)}
.iconbtn:active,.tick:active{transform:scale(.9)}
.li{transition:transform .1s ease}
.card,.li,.tr,.hero{animation:rise .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{animation:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.9s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{top:105%;opacity:.2}}

/* verificação de senha: PBKDF2-SHA256 quando há hash, texto puro como último recurso */
async function pbkdf2(pass,saltHex,iter){
  const enc=new TextEncoder();
  const salt=new Uint8Array((saltHex.match(/../g)||[]).map(h=>parseInt(h,16)));
  const k=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:iter,hash:"SHA-256"},k,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function conferir(rec,valor,fallback){
  if(!rec)return fallback!=null&&fallback===valor;
  if(!(window.crypto&&crypto.subtle))return false;
  const p=String(rec).split("$");
  if(p.length!==4||p[0]!=="pbkdf2")return false;
  try{return (await pbkdf2(valor,p[2],Number(p[1])))===p[3];}catch(e){return false;}
}

function ymd(s){const[a,b,c]=String(s||"").split("-").map(Number);return new Date(a||2027,(b||1)-1,c||1);}
function fmtDate(s){const d=ymd(s);return `${DOW[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;}

function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function monthLabel(k){const[y,m]=k.split("-").map(Number);return `${MESES[m-1]}/${String(y).slice(2)}`;}

function monthRange(){
  const out=[],d=new Date();d.setDate(1);
  const ini=(STATE.config&&STATE.config.inicioPoupanca)||"";
  if(/^\d{4}-\d{2}$/.test(ini)){const p=ini.split("-").map(Number);
    d.setFullYear(p[0],p[1]-1,1);}
  const end=ymd(STATE.config.inicio);let g=0;
  while(d<=end&&g++<72){out.push(monthKey(d));d.setMonth(d.getMonth()+1);}
  if(!out.length)out.push(monthKey(new Date()));
  return out;
}

/* cotação comercial do dia, com cache de 6h e duas fontes */
async function carregarFX(){
  try{
    const c=JSON.parse(localStorage.getItem("tr27_fx")||"null");
    if(c&&c.EUR>0&&Date.now()-c.at<6*3600*1000){FXLIVE=c;renderAll();return;}
  }catch(e){}
  const fontes=[
    async()=>{const r=await fetch("https://economia.awesomeapi.com.br/json/last/EUR-BRL,USD-BRL");
      const j=await r.json();
      const e=parseFloat(j.EURBRL&&j.EURBRL.bid),u=parseFloat(j.USDBRL&&j.USDBRL.bid);
      if(e>0&&u>0)return{EUR:e,USD:u,src:"AwesomeAPI"};throw 0;},
    async()=>{const r=await fetch("https://api.frankfurter.app/latest?from=BRL&to=EUR,USD");
      const j=await r.json();
      if(j&&j.rates&&j.rates.EUR>0)return{EUR:1/j.rates.EUR,USD:1/j.rates.USD,src:"BCE"};throw 0;}
  ];
  for(const f of fontes){
    try{const v=await f();v.at=Date.now();FXLIVE=v;
      try{localStorage.setItem("tr27_fx",JSON.stringify(v));}catch(e){}
      renderAll();return;}catch(e){}
  }
  console.warn("Não consegui buscar a cotação; usando a do admin.");
}

}

function fmtIn(v,m){ // valor em moeda original

function parseMoney(s){
  if(typeof s==="number")return s;
  let t=String(s||"").replace(/[^\d,.-]/g,"");
  if(t.indexOf(",")>-1&&t.indexOf(".")>-1)t=t.replace(/\./g,"").replace(",",".");
  else if(t.indexOf(",")>-1)t=t.replace(",",".");
  const n=parseFloat(t);return isNaN(n)?0:n;
}

async function initFB(){
  try{
    let A,F,U;
    try{
      A=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-app.js`);
      F=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-firestore.js`);
      if(USE_ANON_AUTH)U=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-auth.js`);
    }catch(e){e.code="SDK_LOAD_FAIL";throw e;}
    FB=F;const app=A.initializeApp(firebaseConfig);
    if(APPCHECK_KEY){
      try{
        const AC=await import(`https://www.gstatic.com/firebasejs/${SVER}/firebase-app-check.js`);
        const ac=AC.initializeAppCheck(app,{provider:new AC.ReCaptchaV3Provider(APPCHECK_KEY),isTokenAutoRefreshEnabled:true});
        const tk=await AC.getToken(ac,false);
        APPCHECK_ST=(tk&&tk.token)?"OK — token emitido":"sem token (motivo desconhecido)";
      }catch(err){
        APPCHECK_ST="FALHOU — "+String((err&&err.message)||err).slice(0,120);
        console.warn("App Check:",err);
      }
    }else{APPCHECK_ST="desligado (APPCHECK_KEY vazio no config.js)";}
    if(USE_ANON_AUTH){
      try{await U.signInAnonymously(U.getAuth(app));}
      catch(e){e.code=e.code||"AUTH_FAIL";throw e;}
    }
    db=F.getFirestore(app);
    await ensureSeed();listen();
  }catch(e){
    console.warn("Firestore indisponível — modo local:",e);
    MOCK=true;loadLocal();
    const ob=$("#offbar");
    if(ob){ob.classList.remove("hidden");
      const cod=String((e&&e.code)||(e&&e.name)||"?");
      const dica=!CFG_OK?"O arquivo config.js não foi encontrado ou está sem a apiKey. Confira se ele está no repositório, ao lado do index.html.":
        (/api-key-not-valid/i.test(cod)?"A apiKey do config.js está errada. Copie de novo em Firebase → ⚙ → Configurações do projeto → Seus apps.":
        (/auth\/(admin-restricted|operation-not-allowed|configuration)/.test(cod)?"Ligue o login anônimo em Authentication → Método de login.":
        (/permission|insufficient/i.test(cod+String(e&&e.message))?"Confira as regras do Firestore.":"")));
      ob.innerHTML="⚠️ <b>Sem conexão com o banco.</b> O app está salvando só neste aparelho.<br>"+
        (dica?"<b>"+esc(dica)+"</b><br>":"")+
        "<span style='font-size:11px'>Erro: "+esc(cod)+" — "+esc(String((e&&e.message)||e).slice(0,140))+"</span>";}
    renderAll();
  }
}
async function ensureSeed(){
  const sref=FB.doc(db,NS.viagem,"seeded");
  const snap=await FB.getDoc(sref);
  if(snap.exists())return;
  const b=FB.writeBatch(db);
  b.set(FB.doc(db,NS.viagem,"config"),SEED.config);
  b.set(FB.doc(db,NS.viagem,"roteiro"),SEED.roteiro);
  b.set(FB.doc(db,NS.viagem,"custos"),SEED.custos);
  b.set(FB.doc(db,NS.viagem,"racha"),SEED.racha);
  PEOPLE.forEach(p=>b.set(FB.doc(db,NS.pessoas,p),{meta:0,depositos:[],compras:[],checklist:[],pessoais:[],realizados:[]}));
  b.set(sref,{done:true,at:Date.now()});
  await b.commit();
}
function listen(){
  const doc1=(id,key,fb)=>FB.onSnapshot(FB.doc(db,NS.viagem,id),d=>{
    STATE[key]=d.exists()?Object.assign({},fb,d.data()):JSON.parse(JSON.stringify(fb));renderAll();});
  doc1("config","config",SEED.config);
  doc1("roteiro","roteiro",SEED.roteiro);
  doc1("custos","custos",SEED.custos);
  doc1("racha","racha",SEED.racha);
  FB.onSnapshot(FB.collection(db,NS.pessoas),s=>{
    PEOPLE.forEach(p=>{if(!STATE.pessoas[p])STATE.pessoas[p]={meta:0,depositos:[],compras:[],checklist:[],pessoais:[],realizados:[]};});
    s.forEach(d=>{const v=d.data()||{};STATE.pessoas[d.id]={meta:Number(v.meta)||0,depositos:v.depositos||[],compras:v.compras||[],checklist:v.checklist||[],pessoais:v.pessoais||[],realizados:v.realizados||[]};});
    renderAll();});
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS.mock);
    if(raw){const o=JSON.parse(raw);
      ["config","roteiro","custos","racha"].forEach(k=>{if(o[k])STATE[k]=Object.assign({},SEED[k],o[k]);});
      if(o.pessoas)PEOPLE.forEach(p=>{if(o.pessoas[p])STATE.pessoas[p]=Object.assign(STATE.pessoas[p],o.pessoas[p]);});}
  }catch(e){console.warn(e);}
}
function saveLocal(){
  try{localStorage.setItem(LS.mock,JSON.stringify({config:STATE.config,roteiro:STATE.roteiro,custos:STATE.custos,racha:STATE.racha,pessoas:STATE.pessoas}));}catch(e){}
}
async function saveDoc(id,obj){
  STATE[id]=Object.assign({},STATE[id],obj);
  if(MOCK){saveLocal();renderAll();return;}
  try{await FB.setDoc(FB.doc(db,NS.viagem,id),obj,{merge:true});}
  catch(e){toast("Não deu para salvar");console.error(e);}
}
async function savePessoa(nome,obj){

  try{await FB.setDoc(FB.doc(db,NS.pessoas,nome),obj,{merge:true});}
  catch(e){toast("Não deu para salvar");console.error(e);}
}

function itemPeople(it){
  if(!it)return[];
  if(it.quem==="todos"||!Array.isArray(it.quem))return PEOPLE.slice();
  const g=it.quem.filter(p=>PEOPLE.includes(p));
  return g.length?g:PEOPLE.slice();
}
const naMeta=it=>it&&it.naMeta===false?false:true;
/* passeios do roteiro que têm preço viram itens de orçamento automaticamente */
function roteiroItens(){
  const out=[];
  (STATE.roteiro.dias||[]).forEach(d=>(d.itens||[]).forEach(a=>{
    if(Number(a.valor)>0)out.push({id:d.id+"~"+a.id,cat:"Passeios do roteiro",
      desc:a.titulo,valor:Number(a.valor),moeda:a.moeda||"EUR",
      quem:(Array.isArray(a.quem)&&a.quem.length)?a.quem:"todos",naMeta:true});
  }));
  return out;
}
const custoItens=()=>(STATE.custos.itens||[]).concat(roteiroItens());
function shareShared(p,todos){
  let s=0;custoItens().forEach(it=>{
    if(!todos&&!naMeta(it))return;
    const g=itemPeople(it);if(g.includes(p))s+=toBRL(it.valor,it.moeda)/g.length;});
  return s;
}
/* plano = tudo. orçamento/meta = tudo menos o que está fora da meta (passagens) */
const planoDe=p=>shareShared(p,true)+personalTotal(p);
const foraDaMeta=p=>shareShared(p,true)-shareShared(p,false);
const itensPessoais=p=>((STATE.pessoas[p]||{}).pessoais||[]).map(x=>Object.assign({de:"Custos"},x))
  .concat(((STATE.pessoas[p]||{}).compras||[]).filter(x=>Number(x.valor)>0).map(x=>({id:x.id,desc:x.item,valor:x.valor,moeda:x.moeda,de:"Compras"})));
const personalTotal=p=>itensPessoais(p).reduce((a,i)=>a+toBRL(i.valor,i.moeda),0);
const orcamentoDe=p=>shareShared(p)+personalTotal(p);
const totalShared=()=>custoItens().reduce((a,it)=>a+toBRL(it.valor,it.moeda),0);
const totalMeta=()=>custoItens().filter(naMeta).reduce((a,it)=>a+toBRL(it.valor,it.moeda),0);
const guardado=p=>((STATE.pessoas[p]||{}).depositos||[]).reduce((a,d)=>a+toBRL(d.valor,d.moeda||"BRL"),0);
function metaDe(p){const m=Number((STATE.pessoas[p]||{}).meta)||0;return m>0?m:orcamentoDe(p);}
const metaAuto=p=>!(Number((STATE.pessoas[p]||{}).meta)>0);

/* ---- 10. COFRE (meta e poupança) ----------------------- */
function depMonths(p){
  const map={};((STATE.pessoas[p]||{}).depositos||[]).forEach(d=>{
    const k=d.mes||monthKey(new Date());map[k]=(map[k]||0)+toBRL(d.valor,d.moeda||"BRL");});
  return map;
}
/* alvo do mês corrente: o que faltava no dia 1 dividido pelos meses que sobram */
const iniPoup=()=>{const v=STATE.config.inicioPoupanca||"";return /^\d{4}-\d{2}$/.test(v)?v:"";};
/* meses que sobram para poupar, contando a partir do início do plano */
function mesesRestantes(){
  const t=ymd(STATE.config.inicio),n=new Date();
  let sy=n.getFullYear(),sm=n.getMonth();
  const ini=iniPoup();
  if(ini){const p=ini.split("-").map(Number);
    if(p[0]>sy||(p[0]===sy&&p[1]-1>sm)){sy=p[0];sm=p[1]-1;}}
  return Math.max(1,(t.getFullYear()-sy)*12+(t.getMonth()-sm));
}
const antesDoPlano=()=>{const i=iniPoup();return !!i&&monthKey(new Date())<i;};
function proxMes(mk){const[y,m]=mk.split("-").map(Number);const d=new Date(y,m,1);return monthKey(d);}
function mesInfo(p){
  const mk=monthKey(new Date()),mr=mesesRestantes(),antes=antesDoPlano();
  const total=guardado(p),noMes=(depMonths(p)[mk]||0);
  /* alvo do mês corrente: o que faltava no início do mês, dividido pelos meses restantes */
  const alvo=Math.max(0,(metaDe(p)-(total-noMes))/mr);
  const cumpriu=!antes&&noMes>=alvo-0.005;
  /* ritmo daqui pra frente: o que ainda falta guardado hoje, dividido pelos meses que sobram DEPOIS deste */
  const faltaTotal=Math.max(0,metaDe(p)-total);
  const mrDepois=Math.max(1,mr-1);
  const ritmoFuturo=faltaTotal>0?faltaTotal/mrDepois:0;
  return {mk:mk,alvo:alvo,guardado:noMes,falta:Math.max(0,alvo-noMes),antes:antes,
          ok:cumpriu,pct:alvo>0?clamp(noMes/alvo*100,0,100):100,meses:mr,
          ritmoFuturo:ritmoFuturo,proximo:proxMes(mk),faltaTotal:faltaTotal,acabou:faltaTotal<=0.005};
}
const CORPESSOA={};["#E8722E","#1B3A6B","#3E82C4","#1E9E74"].forEach((c,i)=>CORPESSOA[PEOPLE[i]]=c);
function grupoLinha(){
  // meses: do início do plano (ou 1º depósito) até o mês mais recente com depósito ou hoje
  const todosMeses=[];PEOPLE.forEach(p=>((STATE.pessoas[p]||{}).depositos||[]).forEach(dep=>{if(dep.mes)todosMeses.push(dep.mes);}));
  if(!todosMeses.length)return "";
  const ini=(iniPoup()&&iniPoup()<Math.min.apply(null,todosMeses.map(m=>m))?iniPoup():todosMeses.sort()[0]);
  const fimK=[monthKey(new Date())].concat(todosMeses).sort().pop();
  const meses=[];let d=ymd(ini+"-01");let g=0;
  while(monthKey(d)<=fimK&&g++<60){meses.push(monthKey(d));d.setMonth(d.getMonth()+1);}
  if(meses.length<2)return "";
  // acumulado por pessoa
  const acc={};PEOPLE.forEach(p=>{
    const bym={};((STATE.pessoas[p]||{}).depositos||[]).forEach(dep=>{
      const k=dep.mes||ini;bym[k]=(bym[k]||0)+toBRL(dep.valor,dep.moeda||"BRL");});
    let run=0;acc[p]=meses.map(k=>{run+=(bym[k]||0);return run;});
  });
  const maxV=Math.max(1,...PEOPLE.map(p=>acc[p][acc[p].length-1]));
  const W=300,H=120,pl=6,pr=6,pt=8,pb=16,n=meses.length;
  const x=i=>pl+(i/(n-1))*(W-pl-pr);
  const y=v=>H-pb-(v/maxV)*(H-pt-pb);
  const linhas=PEOPLE.map(p=>{
    const pts=acc[p].map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const last=acc[p][acc[p].length-1];
    return `<polyline points="${pts}" fill="none" stroke="${CORPESSOA[p]}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`+
           `<circle cx="${x(n-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.6" fill="${CORPESSOA[p]}"/>`;
  }).join("");
  const labs=meses.map((k,i)=>(n>8&&i%2)?"":`<text x="${x(i).toFixed(1)}" y="${H-4}" fill="var(--dim)" font-size="7" text-anchor="middle" font-family="Inter">${monthLabel(k)}</text>`).join("");
  const leg=PEOPLE.map(p=>`<span style="white-space:nowrap"><i style="background:${CORPESSOA[p]}"></i>${esc(p)}</span>`).join("");
  return `<div class="card"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:130px;display:block">${labs}${linhas}</svg>
    <div class="lg">${leg}</div></div>`;
}
function mesesStrip(map){
  const keys=Object.keys(map).sort().slice(-6);
  if(!keys.length)return "";
  const max=Math.max.apply(null,keys.map(k=>map[k]))||1;
  return `<div class="card">`+keys.map(k=>`<div class="mrow">
      <span class="ml">${monthLabel(k)}</span>
      <span class="mb"><i style="width:${Math.max(3,map[k]/max*100)}%"></i></span>
      <span class="mv money">${fmt(map[k])}</span></div>`).join("")+`</div>`;
}
function depositoModal(valor){
  const me=STATE.me,mk=mesPadrao(),mo=moedaDe(me);
  openModal("Registrar depósito",[
    {id:"valor",label:"Valor",type:"money",value:valor?String(conv(valor,mo).toFixed(2)).replace(".",","):"",placeholder:"0,00"},
    {id:"moeda",label:"Moeda",type:"select",options:["BRL","USD","EUR"],value:mo},
    {id:"mes",label:"Referente a",type:"select",options:monthRange().map(k=>({v:k,l:monthLabel(k)})),value:mk},
    {id:"nota",label:"Nota",placeholder:"opcional"}
  ],v=>{
    if(v.valor<=0){toast("Informe um valor");return false;}
    savePessoa(me,{depositos:(meDoc().depositos||[]).concat([{id:uid(),valor:v.valor,moeda:v.moeda||mo,mes:v.mes||mk,nota:v.nota}])});
    toast("Depósito registrado");},"Registrar");
}
const MARCOS=[25,50,75,100];
function checarMarco(me,pct){
  try{
    const key="tr27_marco_"+me, visto=Number(localStorage.getItem(key)||0);
    let novo=0;MARCOS.forEach(m=>{if(pct>=m)novo=m;});
    if(novo>visto){localStorage.setItem(key,String(novo));
      if(visto>0||novo>=25)setTimeout(()=>celebrar(novo),350);}
    else if(novo<visto)localStorage.setItem(key,String(novo));
  }catch(e){}
}
function celebrar(m){
  const msg=m>=100?"Meta batida! 🎉":`${m}% da meta alcançados! 🎯`;
  toast(msg);
  const c=document.createElement("div");c.className="confetti";
  const cores=["#E8722E","#1B3A6B","#3E82C4","#1E9E74"];
  for(let i=0;i<24;i++){const p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";p.style.background=cores[i%4];
    p.style.animationDelay=(Math.random()*.3)+"s";p.style.transform=`rotate(${Math.random()*360}deg)`;
    c.appendChild(p);}
  document.body.appendChild(c);setTimeout(()=>c.remove(),2200);
}

/* ---- realizados (gastos efetivos, por pessoa) ----------- */
const meusRealizados=p=>((STATE.pessoas[p]||{}).realizados||[]);
const realizadoTotal=p=>meusRealizados(p).reduce((a,r)=>a+toBRL(r.valor,r.moeda),0);
const realizadoBRL=p=>realizadoTotal(p);
/* quanto do plano da pessoa já foi "coberto" pela categoria de cada gasto realizado — comparação simples por total */
function comparativo(p){
  const plan=planoDe(p), real=realizadoTotal(p);
  return {plan:plan,real:real,dif:real-plan};
}

/* ---- 12. MODAL GENÉRICO -------------------------------- */
function openModal(title,fields,onSave,saveLabel){
  const body=fields.map(f=>{
    if(f.type==="select")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><select id="m_${f.id}">${
        (f.options||[]).map(o=>{const v=typeof o==="object"?o.v:o,l=typeof o==="object"?o.l:o;
        return `<option value="${esc(v)}" ${String(v)===String(f.value)?"selected":""}>${esc(l)}</option>`;}).join("")}</select></div>`;
    if(f.type==="chips")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><div class="chips" id="m_${f.id}">${
        PEOPLE.map(p=>`<span class="chip ${(f.value||[]).indexOf(p)>-1?"on":""}" data-p="${esc(p)}">${esc(p)}</span>`).join("")}</div></div>`;
    if(f.type==="area")
      return `<div class="fld"><label class="f">${esc(f.label)}</label><textarea id="m_${f.id}" rows="3" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea></div>`;
    if(f.type==="cat"){
      const cats=categorias(),val=f.value||cats[0];
      return `<div class="fld"><label class="f">${esc(f.label)}</label>
        <select id="m_${f.id}">${cats.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${esc(o)}</option>`).join("")}<option value="__nova__">+ Nova categoria…</option></select>
        <input id="m_${f.id}_nova" placeholder="Nome da nova categoria" style="margin-top:7px;display:none"></div>`;
    }
    const t=f.type==="money"?"text":(f.type||"text");
    return `<div class="fld"><label class="f">${esc(f.label)}</label><input id="m_${f.id}" type="${t}" ${f.type==="money"?'inputmode="decimal"':""} value="${esc(f.value==null?"":f.value)}" placeholder="${esc(f.placeholder||"")}"></div>`;
  }).join("");
  $("#modal").innerHTML=`<div class="modal"><div class="box"><h3>${esc(title)}</h3>${body}
    <div class="row" style="gap:8px;margin-top:6px">
      <button class="btn gh" id="mcancel" style="flex:1">Cancelar</button>
      <button class="btn" id="mok" style="flex:2">${esc(saveLabel||"Salvar")}</button></div></div></div>`;
  const close=()=>{$("#modal").innerHTML="";};
  $("#mcancel").onclick=close;
  $("#modal").querySelector(".modal").onclick=e=>{if(e.target===e.currentTarget)close();};
  fields.filter(f=>f.type==="chips").forEach(f=>{
    $("#m_"+f.id).querySelectorAll(".chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));});
  fields.filter(f=>f.type==="cat").forEach(f=>{
    const sel=$("#m_"+f.id),inp=$("#m_"+f.id+"_nova");
    sel.onchange=()=>{const nova=sel.value==="__nova__";inp.style.display=nova?"block":"none";if(nova)inp.focus();};});
  $("#mok").onclick=()=>{
    const out={};
    fields.forEach(f=>{
      if(f.type==="chips")out[f.id]=Array.from($("#m_"+f.id).querySelectorAll(".chip.on")).map(c=>c.dataset.p);
      else if(f.type==="money")out[f.id]=parseMoney($("#m_"+f.id).value);
      else if(f.type==="cat"){const sel=$("#m_"+f.id);
        out[f.id]=sel.value==="__nova__"?($("#m_"+f.id+"_nova").value.trim()||"Outros"):sel.value;}
      else out[f.id]=$("#m_"+f.id).value.trim();
    });
    if(onSave(out)!==false)close();
  };
}

/* ---- 15. RACHA (despesas e acerto) --------------------- */
const fmtMO=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:MOEDA_VIAGEM(),
  minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0);
function balances(){
  const b={};PEOPLE.forEach(p=>b[p]=0);
  (STATE.racha.despesas||[]).forEach(d=>{
    const cents=Math.round(toMO(d.valor,d.moeda)*100);
    const g=(Array.isArray(d.entre)&&d.entre.length?d.entre:PEOPLE).filter(p=>b[p]!=null);
    if(!g.length)return;
    if(b[d.pagou]!=null)b[d.pagou]+=cents;
    const each=Math.floor(cents/g.length),resto=cents-each*g.length;
    g.forEach((p,i)=>b[p]-=each+(i<resto?1:0));
  });
  (STATE.racha.pagamentos||[]).forEach(t=>{
    const cents=Math.round(toMO(t.valor,t.moeda)*100);
    if(b[t.de]!=null)b[t.de]+=cents;
    if(b[t.para]!=null)b[t.para]-=cents;
  });
  return b;
}
/* menor número possível de transferências.
   1) parte os saldos no MAIOR número de grupos que fecham em zero
      (busca exata por bitmask — grupos independentes nunca precisam
       trocar dinheiro entre si);
   2) dentro de cada grupo, casa sempre o maior devedor com o maior
      credor, então todo pagamento vai de quem deve para quem tem
      a receber, sem ninguém virar intermediário.                    */
function grupoGuloso(names,vals){
  const a=names.map((n,i)=>({n:n,v:vals[i]})).filter(x=>x.v!==0),out=[];
  let guard=0;
  while(guard++<400){
    a.sort((x,y)=>x.v-y.v);
    const d=a[0],c=a[a.length-1];
    if(!d||!c||d.v>=0||c.v<=0)break;
    const amt=Math.min(-d.v,c.v);
    out.push({de:d.n,para:c.n,v:amt});
    d.v+=amt;c.v-=amt;
  }
  return out;
}
function settle(bal){
  const names=[],vals=[];
  Object.keys(bal).forEach(k=>{if(bal[k]!==0){names.push(k);vals.push(bal[k]);}});
  const n=names.length;
  if(!n)return[];
  if(n>14)return grupoGuloso(names,vals);
  const size=1<<n,soma=new Array(size).fill(0);
  for(let m=1;m<size;m++){const low=m&(-m),i=31-Math.clz32(low);soma[m]=soma[m&(m-1)]+vals[i];}
  const best=new Array(size).fill(-1),pick=new Array(size).fill(0);
  best[0]=0;
  for(let m=1;m<size;m++){
    const low=m&(-m);
    for(let sub=m;sub>0;sub=(sub-1)&m){
      if(!(sub&low))continue;
      if(soma[sub]!==0)continue;
      const r=best[m^sub];
      if(r>=0&&r+1>best[m]){best[m]=r+1;pick[m]=sub;}
    }
  }
  let m=size-1;
  if(best[m]<0)return grupoGuloso(names,vals);
  const out=[];
  while(m>0){
    const g=pick[m],idx=[];
    for(let i=0;i<n;i++)if(g&(1<<i))idx.push(i);
    out.push.apply(out,grupoGuloso(idx.map(i=>names[i]),idx.map(i=>vals[i])));
    m^=g;
  }
  return out.sort((x,y)=>y.v-x.v);
}
function renderRacha(){
  const me=STATE.me;
  const desp=(STATE.racha.despesas||[]).slice().sort((a,b)=>String(b.data||"").localeCompare(String(a.data||"")));
  const pags=(STATE.racha.pagamentos||[]).slice().reverse();
  const bal=balances(),trs=settle(Object.assign({},bal));
  const totalG=(STATE.racha.despesas||[]).reduce((a,d)=>a+toMO(d.valor,d.moeda),0);
  const meuC=-(bal[me]||0)/100;
  const hoje=new Date().toISOString().slice(0,10);
  const maxAbs=Math.max(1,...PEOPLE.map(p=>Math.abs(bal[p]||0)));

  $("#p-racha").innerHTML=`
  <div class="card tight"><div class="row">
    <div class="grow"><div class="lbl">Gasto do grupo</div>
      <div class="disp money" style="font-size:28px">${fmtMO(totalG)}</div></div>
    <div style="text-align:right"><div class="lbl">${meuC>0?"você deve":"você recebe"}</div>
      <div class="disp money" style="font-size:22px;color:${Math.abs(meuC)<0.005?"var(--muted)":(meuC>0?"var(--danger)":"var(--ok)")}">${fmtMO(Math.abs(meuC))}</div></div>
  </div></div>

  <button class="btn" id="dsadd">+ Lançar despesa</button>

  <div class="sect">Acerto final<span class="r">${trs.length?`<span class="lnk" id="rachashare">compartilhar</span>`:trs.length+" transferências"}</span></div>
  ${trs.length?trs.map((t,i)=>`<div class="tr">
      <div class="who">${esc(t.de)}<span class="ar">→</span>${esc(t.para)}</div>
      <div class="v money">${fmtMO(t.v/100)}</div>
      <button class="btn sm gh" data-quit="${i}">quitar</button></div>`).join("")+
    `<div class="note">Tudo em ${MOEDA_VIAGEM()}, para acertarem na moeda corrente no fim da viagem. Dívidas já foram cruzadas: cada um paga o mínimo de vezes possível. "Quitar" registra a transferência como feita.</div>`:
    (totalG?'<div class="okbox">Tudo acertado. Ninguém deve nada a ninguém.</div>':
    '<div class="empty">Sem despesas ainda.<br>Durante a viagem, lance aqui quem pagou o quê.</div>')}

  <div class="sect">Saldo de cada um</div>
  <div class="card">
    ${PEOPLE.map(p=>{const v=(bal[p]||0)/100,w=Math.abs(bal[p]||0)/maxAbs*100;
      return `<div class="bal"><div class="n ${p===me?"":""}" style="${p===me?"color:var(--par)":""}">${esc(p)}</div>
        <div class="barmini"><i class="${v<0?"neg":""}" style="width:${w}%;${v<0?"right:0":"left:0"}"></i></div>
        <div class="v ${v>=0?"pos":"neg"} money">${v>=0?"+":"−"}${fmtMO(Math.abs(v))}</div></div>`;}).join("")}
    <div class="note">Positivo = já pagou mais do que consumiu.</div>
  </div>

  <div class="sect">Despesas<span class="r">${desp.length}</span></div>
  ${desp.map(d=>{const g=(Array.isArray(d.entre)&&d.entre.length?d.entre:PEOPLE);
    return `<div class="li"><div class="t"><div class="n">${esc(d.desc)}</div>
      <div class="s">${esc(d.pagou)} pagou · ${g.length===PEOPLE.length?"dividido entre todos":"entre "+g.map(esc).join(", ")} · ${esc(fmtDate(d.data))}</div></div>
      <div class="v money">${fmtIn(d.valor,d.moeda)}</div>
      <button class="x" data-dedt="${d.id}" aria-label="Editar">✎</button>
      <button class="x" data-ddl="${d.id}" aria-label="Excluir">✕</button></div>`;}).join("")}

  ${pags.length?`<div class="sect">Transferências feitas</div>
    ${pags.map(t=>`<div class="li"><div class="t"><div class="n">${esc(t.de)} → ${esc(t.para)}</div>
      <div class="s">${esc(fmtDate(t.data))}</div></div><div class="v money">${fmtIn(t.valor,t.moeda)}</div>
      <button class="x" data-pdl="${t.id}" aria-label="Excluir">✕</button></div>`).join("")}`:""}`;

  const rs=$("#rachashare");
  if(rs)rs.onclick=async()=>{
    const linhas=trs.map(t=>`• ${t.de} → ${t.para}: ${fmtMO(t.v/100)}`).join("\n");
    const txt=`Acerto da EuroTrip 2027 💶\nGasto do grupo: ${fmtMO(totalG)}\n\nQuem paga quem:\n${linhas}\n\n(mínimo de transferências, valores em ${MOEDA_VIAGEM()})`;
    try{
      if(navigator.share){await navigator.share({text:txt});}
      else{await navigator.clipboard.writeText(txt);toast("Acerto copiado ✓");}
    }catch(e){try{await navigator.clipboard.writeText(txt);toast("Acerto copiado ✓");}catch(_){toast("Não consegui compartilhar");}}

    {id:"data",label:"Data",type:"date",value:hoje}

    if(!v.entre.length){toast("Escolha entre quem dividir");return false;}
    saveDoc("racha",{despesas:(STATE.racha.despesas||[]).concat([{id:uid(),desc:v.desc,valor:v.valor,moeda:v.moeda,pagou:v.pagou,entre:v.entre,data:v.data||hoje}])});
    toast("Despesa lançada");},"Lançar");

  $("#p-racha").querySelectorAll("[data-quit]").forEach(b=>b.onclick=()=>{
    const t=trs[Number(b.dataset.quit)];if(!t)return;
    saveDoc("racha",{pagamentos:(STATE.racha.pagamentos||[]).concat([{id:uid(),de:t.de,para:t.para,valor:t.v/100,moeda:MOEDA_VIAGEM(),data:hoje}])});
    toast("Transferência registrada");});
  $("#p-racha").querySelectorAll("[data-ddl]").forEach(b=>b.onclick=()=>
    saveDoc("racha",{despesas:(STATE.racha.despesas||[]).filter(x=>x.id!==b.dataset.ddl)}));
  $("#p-racha").querySelectorAll("[data-dedt]").forEach(b=>b.onclick=()=>{
    const d=(STATE.racha.despesas||[]).find(x=>x.id===b.dataset.dedt);if(!d)return;
    openModal("Editar despesa",[
      {id:"desc",label:"O que foi",value:d.desc,placeholder:"Ex.: jantar"},
      {id:"valor",label:"Valor",type:"money",value:String(d.valor).replace(".",","),placeholder:"0,00"},
      {id:"moeda",label:"Moeda",type:"select",options:["EUR","BRL","USD"],value:d.moeda||"EUR"},
      {id:"pagou",label:"Quem pagou",type:"select",options:PEOPLE,value:d.pagou},
      {id:"entre",label:"Dividir entre",type:"chips",value:(Array.isArray(d.entre)&&d.entre.length?d.entre:PEOPLE.slice())},
      {id:"data",label:"Data",type:"date",value:d.data||hoje}
    ],v=>{
      if(!v.desc||v.valor<=0){toast("Preencha descrição e valor");return false;}
      if(!v.entre.length){toast("Escolha entre quem dividir");return false;}
      saveDoc("racha",{despesas:(STATE.racha.despesas||[]).map(x=>x.id===d.id?{id:d.id,desc:v.desc,valor:v.valor,moeda:v.moeda,pagou:v.pagou,entre:v.entre,data:v.data||hoje}:x)});
      toast("Despesa atualizada");},"Salvar");});
  $("#p-racha").querySelectorAll("[data-pdl]").forEach(b=>b.onclick=()=>
    saveDoc("racha",{pagamentos:(STATE.racha.pagamentos||[]).filter(x=>x.id!==b.dataset.pdl)}));
}

let admView="custos";
function renderAdmin(){
  const el=$("#p-admin");if(!el)return;
  if(!isAdmin()){
    el.innerHTML=`<div class="card"><div class="note" style="margin:0 0 10px">Área do admin: editar orçamento, roteiro, datas e câmbio.</div>
      <input id="apin" type="password" autocomplete="current-password" placeholder="senha do admin" style="text-align:center;font-weight:700">
      <button class="btn" id="aenter" style="margin-top:10px">Entrar</button><div id="aerr" class="err"></div></div>`;
    const go=async()=>{
      const b=$("#aenter");b.disabled=true;b.textContent="Conferindo…";
      const ok=await checarAdmin($("#apin").value);
      b.disabled=false;b.textContent="Entrar";
      if(ok){localStorage.setItem(LS.admin,"1");renderAll();show("admin");toast("Modo admin ligado");}
      else{$("#aerr").textContent="Senha incorreta.";$("#apin").value="";}};
    $("#aenter").onclick=go;
    $("#apin").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
    return;
  }
  const c=STATE.config,itens=(STATE.custos.itens||[]);
  el.innerHTML=`
  <div class="seg" id="aseg">
    <div data-v="custos" class="${admView==="custos"?"on":""}">Orçamento</div>
    <div data-v="config" class="${admView==="config"?"on":""}">Viagem</div>
    <div data-v="tools" class="${admView==="tools"?"on":""}">Ferramentas</div>
  </div>

  <div class="${admView==="custos"?"":"hidden"}">
    <button class="btn" id="citadd">+ Novo item do orçamento</button>
    <div class="sect">Itens<span class="r">${fmt(totalShared())}</span></div>
    <div class="adm-scroll">
      ${itens.map(it=>{const g=itemPeople(it);return `<div class="li" style="margin-bottom:6px">
        <div class="t"><div class="n">${esc(it.desc)}</div>
          <div class="s">${esc(it.cat)} · ${g.length===PEOPLE.length?"todos":g.map(esc).join(", ")}${naMeta(it)?"":" · fora da meta"}</div></div>
        <div class="v money">${fmtIn(it.valor,it.moeda)}</div>
        <button class="x" data-cite="${it.id}" aria-label="Editar">✎</button>
        <button class="x" data-citd="${it.id}" aria-label="Excluir">✕</button></div>`;}).join("")||'<div class="empty">Nenhum item.</div>'}
    </div>
    <div class="note">Cada pessoa vê o próprio rateio na aba Custos, e ele vira a meta automática no Cofre.</div>
  </div>

  <div class="${admView==="config"?"":"hidden"}">
    <div class="card">
      <div class="fld"><label class="f" for="cnome">Nome da viagem</label><input id="cnome" value="${esc(c.nome||"")}"></div>
      <div class="fld"><label class="f" for="ctag">Legenda do topo</label><input id="ctag" value="${esc(c.tagline||"")}"></div>
      <div class="f2">
        <div><label class="f" for="cini">Início</label><input id="cini" type="date" value="${esc(c.inicio||"")}"></div>
        <div><label class="f" for="cfim">Fim</label><input id="cfim" type="date" value="${esc(c.fim||"")}"></div>
      </div>
      <div class="f2" style="margin-top:9px">
        <div><label class="f" for="ceur">€ 1 em reais</label><input id="ceur" inputmode="decimal" value="${String((c.fx||{}).EUR||"").replace(".",",")}"></div>
        <div><label class="f" for="cusd">US$ 1 em reais</label><input id="cusd" inputmode="decimal" value="${String((c.fx||{}).USD||"").replace(".",",")}"></div>
      </div>
      <div class="fld" style="margin-top:9px"><label class="f" for="cpoup">Poupança começa em</label>
        <select id="cpoup">${monthRange().map(k=>`<option value="${k}" ${k===iniPoup()?"selected":""}>${monthLabel(k)}</option>`).join("")}</select></div>
      <div class="fld"><label class="f" for="cnota">Recado do rodapé</label><input id="cnota" value="${esc(c.nota||"")}"></div>
      <button class="btn" id="csave">Salvar viagem</button>

    <div class="sect">Cidades</div>

      <button class="btn sec" id="cidsave">Salvar cidades</button>

  <div class="${admView==="tools"?"":"hidden"}">

      <div class="note" style="margin:0 0 10px">Banco: <b>${MOCK?"local (sem conexão)":"conectado ao Firestore"}</b><br>

  </div>`;

  $("#aseg").querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>{admView=x.dataset.v;renderAdmin();});

    {id:"cat",label:"Categoria",type:"select",options:cats,value:it?it.cat:"Hospedagem"},

    {id:"moeda",label:"Moeda",type:"select",options:["EUR","BRL","USD"],value:it?it.moeda:"EUR"},
    {id:"quem",label:"Dividir entre",type:"chips",value:it?itemPeople(it):PEOPLE.slice()},
    {id:"naMeta",label:"Entra na meta de poupança?",type:"select",
     options:[{v:"sim",l:"Sim — precisa estar guardado"},{v:"nao",l:"Não — vai parcelado no cartão"}],
     value:it?(naMeta(it)?"sim":"nao"):"sim"}
  ],v=>{
    if(!v.desc||v.valor<=0){toast("Preencha descrição e valor");return false;}

      naMeta:v.naMeta!=="nao",

    toast("Orçamento atualizado");});
  $("#citadd").onclick=()=>itemForm(null);
  el.querySelectorAll("[data-cite]").forEach(b=>b.onclick=()=>itemForm(itens.find(x=>x.id===b.dataset.cite)));
  el.querySelectorAll("[data-citd]").forEach(b=>b.onclick=()=>{
    if(!confirm("Excluir este item?"))return;
    saveDoc("custos",{itens:itens.filter(x=>x.id!==b.dataset.citd)});});
  const cs=$("#csave");
  if(cs)cs.onclick=()=>{
    saveDoc("config",{nome:$("#cnome").value.trim()||"Viagem",tagline:$("#ctag").value.trim(),
      inicio:$("#cini").value,fim:$("#cfim").value,nota:$("#cnota").value.trim(),
      inicioPoupanca:$("#cpoup").value,
      fx:{EUR:parseMoney($("#ceur").value)||6.2,USD:parseMoney($("#cusd").value)||5.4}});
    toast("Viagem atualizada");};

    const cid=(c.cidades||[]).map((x,i)=>Object.assign({},x,{
      n:el.querySelector(`[data-cn="${i}"]`).value.trim()||x.n,
      de:el.querySelector(`[data-cd="${i}"]`).value||x.de,
      ate:el.querySelector(`[data-ca="${i}"]`).value||x.ate}));
    saveDoc("config",{cidades:cid});toast("Cidades atualizadas");};
  const ao=$("#aout");

  if(rr)rr.onclick=()=>{if(confirm("Substituir o roteiro atual pelo sugerido?"))
    {saveDoc("roteiro",JSON.parse(JSON.stringify(SEED.roteiro)));toast("Roteiro restaurado");}};
  const rc=$("#rcustos");
  if(rc)rc.onclick=()=>{if(confirm("Substituir o orçamento atual pelo sugerido?"))
    {saveDoc("custos",JSON.parse(JSON.stringify(SEED.custos)));toast("Orçamento restaurado");}};
  const ms=$("#mstrsave");
  if(ms)ms.onclick=()=>{
    const linhas=$("#mstr").value.split("\n").map(x=>x.trim()).filter(Boolean);
    if(!linhas.length){toast("A lista não pode ficar vazia");return;}
    saveDoc("config",{checklistMaster:linhas});toast("Lista master salva");};
  const mr=$("#mstrreset");
  if(mr)mr.onclick=()=>{if(confirm("Voltar a lista master para a padrão do app?"))
    {saveDoc("config",{checklistMaster:SEED.checklistModelo.slice()});toast("Lista master restaurada");}};
